name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BLUX_APP_ID: ${{ secrets.VITE_BLUX_APP_ID }}
      VITE_PRIVY_APP_ID: ${{ secrets.VITE_PRIVY_APP_ID }}
      VITE_PARA_API_KEY: ${{ secrets.VITE_PARA_API_KEY }}
      VITE_PARA_ENVIRONMENT: BETA
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=1 build
      - name: Assemble site
        run: |
          mkdir -p _site
          for app in stellar-wallets-kit blux privy para passkey-kit smart-account-kit; do
            cp -r "apps/$app/dist" "_site/$app"
          done
          cp site-root/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
